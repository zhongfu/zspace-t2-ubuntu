name: Build

# Build the boot chain on pull requests and branch pushes, so breakage shows up
# before a release.  No artefacts are kept: release.yml does that on a tag.
#
# The boot chain is build-all.sh steps 1 to 6: the vendor firmware, the
# initramfs that embeds it, the kernel and U-Boot - everything the board needs
# to boot.  It skips the rootfs and the installer image (steps 7 and 8), which
# are the slowest and need the most network, and which release.yml builds
# anyway.  Step 1 is not optional even though it is only verification: it writes
# the driver-named firmware copies the initramfs embeds.
#
# arm64 only: that is what the board is, and GitHub's arm64 runners are free for
# public repositories.  The vendor WiFi/BT firmware is committed in the
# repository, so no secret or setup is needed.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Build the boot chain (firmware, initramfs, kernel, U-Boot)
        run: ./docker-build.sh ./build-all.sh --from 1 --to 6
