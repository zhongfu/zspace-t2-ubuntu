name: Build

# Build the fast subset on pull requests and branch pushes, so breakage shows
# up before a release.  No artefacts are kept: release.yml does that on a tag.
#
# The subset is initramfs + kernel tree + kernel + U-Boot (build-all.sh steps
# 2..6).  It skips the rootfs and the installer image, which are the slowest
# and need the most network.  The vendor WiFi/BT firmware is committed in the
# repository, so no secret or setup is needed.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both host architectures: the build has to work on either (docs/building.md).
    # The arm64 job is where the Dockerfile's per-arch package list and the
    # cross toolchain get exercised on arm64; GitHub's arm64 runners are free for
    # public repositories.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Build the fast subset
        run: ./docker-build.sh ./build-all.sh --from 2 --to 6
